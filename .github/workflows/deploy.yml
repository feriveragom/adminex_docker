# Deploy automático a Gigalixir cuando se hace push a main/master
# 
# ⚠️ DESACTIVADO hasta configurar Gigalixir
# Para activar: descomentar las líneas de 'on:' y comentar 'on: workflow_dispatch'
#
name: Deploy to Gigalixir

# Deploy automático en push a main/master
on:
  push:
    branches:
      - main
      - master
  # También permite activación manual
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para git push

      - name: Setup Python (for Gigalixir CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Gigalixir CLI
        run: pip install gigalixir

      - name: Deploy to Gigalixir
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_USERNAME }}
          GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_PASSWORD }}
          GIGALIXIR_APP_NAME: ${{ secrets.GIGALIXIR_APP_NAME }}
        run: |
          git remote add gigalixir https://$GIGALIXIR_EMAIL:$GIGALIXIR_API_KEY@git.gigalixir.com/$GIGALIXIR_APP_NAME.git || true
          git push -f gigalixir HEAD:refs/heads/main
