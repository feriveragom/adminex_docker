events {
    worker_connections 1024;
}

http {
    # Servidor HTTP para redirigir a HTTPS
    server {
        listen 80;
        server_name adminex.docker.com;
        # Esta línea redirige automáticamente HTTP a HTTPS
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS (Proxy Inverso)
    server {
        listen 443 ssl;
        server_name adminex.docker.com;

        # Ubicación de los certificados dentro del contenedor (definidos en docker-compose.yml)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Configuraciones SSL recomendadas
        ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5; # Puedes descomentar esto si es necesario

        location / {
            # Redirige todo el tráfico al contenedor de la app Phoenix
            proxy_pass http://adminex_app:4000;
            
            # Headers estándar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Headers necesarios para WebSockets (Phoenix LiveView / Channels)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
